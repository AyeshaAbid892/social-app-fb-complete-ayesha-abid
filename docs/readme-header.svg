<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1000" cy="60" r="220" fill="url(#glow)"/>
  <circle cx="120" cy="260" r="180" fill="url(#glow)"/>

  <!-- decorative grid dots -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="60" cy="40" r="2.5"/><circle cx="100" cy="40" r="2.5"/><circle cx="140" cy="40" r="2.5"/>
    <circle cx="60" cy="70" r="2.5"/><circle cx="100" cy="70" r="2.5"/><circle cx="140" cy="70" r="2.5"/>
    <circle cx="60" cy="100" r="2.5"/><circle cx="100" cy="100" r="2.5"/><circle cx="140" cy="100" r="2.5"/>
  </g>

  <!-- floating mock post cards (right side) -->
  <g transform="translate(830,55)">
    <rect width="300" height="86" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="30" cy="30" r="14" fill="#93c5fd"/>
    <rect x="54" y="20" width="120" height="9" rx="4.5" fill="#dbeafe" opacity="0.9"/>
    <rect x="54" y="36" width="80" height="7" rx="3.5" fill="#dbeafe" opacity="0.55"/>
    <rect x="20" y="58" width="260" height="7" rx="3.5" fill="#dbeafe" opacity="0.35"/>
    <rect x="20" y="70" width="180" height="7" rx="3.5" fill="#dbeafe" opacity="0.35"/>
  </g>
  <g transform="translate(870,158)">
    <rect width="280" height="86" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="30" cy="30" r="14" fill="#fbbf24"/>
    <rect x="54" y="20" width="110" height="9" rx="4.5" fill="#dbeafe" opacity="0.9"/>
    <rect x="54" y="36" width="70" height="7" rx="3.5" fill="#dbeafe" opacity="0.55"/>
    <rect x="20" y="58" width="240" height="7" rx="3.5" fill="#dbeafe" opacity="0.35"/>
    <rect x="20" y="70" width="160" height="7" rx="3.5" fill="#dbeafe" opacity="0.35"/>
  </g>

  <!-- like / comment glyphs -->
  <g transform="translate(1000,232)" fill="#ffffff" opacity="0.85">
    <path d="M0 10 C0 4 5 0 10 0 C13 0 15 1.5 16 3.5 C17 1.5 19 0 22 0 C27 0 32 4 32 10 C32 18 16 28 16 28 C16 28 0 18 0 10 Z" transform="scale(0.55)"/>
  </g>

  <!-- title block -->
  <g transform="translate(64,92)">
    <rect width="46" height="46" rx="12" fill="#ffffff"/>
    <text x="23" y="32" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1d4ed8" text-anchor="middle">S</text>

    <text x="64" y="20" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#ffffff">SocialApp</text>
    <text x="66" y="48" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#dbeafe" opacity="0.92">Facebook-Inspired Social Media Platform — React Frontend Project</text>
  </g>

  <!-- tech badges -->
  <g transform="translate(64,175)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(0,0)"><rect width="94" height="30" rx="15" fill="#ffffff" opacity="0.16"/><text x="47" y="20" fill="#ffffff" text-anchor="middle">React 19</text></g>
    <g transform="translate(104,0)"><rect width="130" height="30" rx="15" fill="#ffffff" opacity="0.16"/><text x="65" y="20" fill="#ffffff" text-anchor="middle">React Router v7</text></g>
    <g transform="translate(244,0)"><rect width="118" height="30" rx="15" fill="#ffffff" opacity="0.16"/><text x="59" y="20" fill="#ffffff" text-anchor="middle">Tailwind CSS</text></g>
    <g transform="translate(372,0)"><rect width="150" height="30" rx="15" fill="#ffffff" opacity="0.16"/><text x="75" y="20" fill="#ffffff" text-anchor="middle">React Hook Form</text></g>
    <g transform="translate(532,0)"><rect width="132" height="30" rx="15" fill="#ffffff" opacity="0.16"/><text x="66" y="20" fill="#ffffff" text-anchor="middle">Context API</text></g>
  </g>
  <g transform="translate(64,215)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(0,0)"><rect width="112" height="30" rx="15" fill="#ffffff" opacity="0.16"/><text x="56" y="20" fill="#ffffff" text-anchor="middle">localStorage</text></g>
    <g transform="translate(122,0)"><rect width="86" height="30" rx="15" fill="#ffffff" opacity="0.16"/><text x="43" y="20" fill="#ffffff" text-anchor="middle">Vite 8</text></g>
    <g transform="translate(218,0)"><rect width="150" height="30" rx="15" fill="#ffffff" opacity="0.16"/><text x="75" y="20" fill="#ffffff" text-anchor="middle">Zero Backend</text></g>
  </g>
</svg>
