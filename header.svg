<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Trebuchet MS', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="45%" stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#131b3f"/>
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c451" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f5c451"/>
      <stop offset="100%" stop-color="#e6ac2c"/>
    </linearGradient>

    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="rounded">
      <rect x="0" y="0" width="1200" height="320" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Base background -->
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- Drifting ambient glows -->
    <circle cx="150" cy="60" r="220" fill="url(#goldGlow)">
      <animate attributeName="cx" values="150;230;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;110;60" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="260" r="240" fill="url(#cyanGlow)">
      <animate attributeName="cx" values="1040;950;1040" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;210;260" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="30" r="150" fill="url(#cyanGlow)" opacity="0.6">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Subtle grid dots -->
    <g fill="#ffffff" opacity="0.06">
      <circle cx="40" cy="30" r="1.6"/><circle cx="70" cy="30" r="1.6"/><circle cx="100" cy="30" r="1.6"/>
      <circle cx="40" cy="58" r="1.6"/><circle cx="70" cy="58" r="1.6"/><circle cx="100" cy="58" r="1.6"/>
      <circle cx="40" cy="86" r="1.6"/><circle cx="70" cy="86" r="1.6"/><circle cx="100" cy="86" r="1.6"/>
      <circle cx="1100" cy="240" r="1.6"/><circle cx="1130" cy="240" r="1.6"/><circle cx="1160" cy="240" r="1.6"/>
      <circle cx="1100" cy="268" r="1.6"/><circle cx="1130" cy="268" r="1.6"/><circle cx="1160" cy="268" r="1.6"/>
      <circle cx="1100" cy="296" r="1.6"/><circle cx="1130" cy="296" r="1.6"/><circle cx="1160" cy="296" r="1.6"/>
    </g>

    <!-- Animated connecting network (social graph motif) -->
    <g stroke="url(#cardStroke)" stroke-width="1.2" opacity="0.55">
      <line x1="90" y1="230" x2="200" y2="180">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="200" y1="180" x2="150" y2="120">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
      </line>
      <line x1="1000" y1="70" x2="1090" y2="120">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/>
      </line>
      <line x1="1090" y1="120" x2="1040" y2="180">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.8s" repeatCount="indefinite"/>
      </line>
    </g>
    <g fill="#22d3ee">
      <circle cx="90" cy="230" r="3.5">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="180" r="3">
        <animate attributeName="r" values="2.5;4.5;2.5" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="120" r="2.5" fill="#f5c451">
        <animate attributeName="r" values="2;4;2" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#f5c451">
      <circle cx="1000" cy="70" r="3">
        <animate attributeName="r" values="2.5;4.5;2.5" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="120" r="3.5" fill="#22d3ee">
        <animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="180" r="2.5">
        <animate attributeName="r" values="2;4;2" dur="3.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Floating glass cards -->
    <g transform="translate(870,40)" opacity="0.9">
      <rect width="270" height="72" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="url(#cardStroke)" stroke-width="1"/>
      <circle cx="26" cy="26" r="12" fill="#22d3ee" fill-opacity="0.8"/>
      <rect x="48" y="17" width="110" height="8" rx="4" fill="#f5c451" opacity="0.85"/>
      <rect x="48" y="31" width="70" height="6" rx="3" fill="#8fa2d6" opacity="0.6"/>
      <rect x="18" y="50" width="234" height="6" rx="3" fill="#8fa2d6" opacity="0.35"/>
      <animateTransform attributeName="transform" type="translate" values="870,40; 870,28; 870,40" dur="6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(905,150)" opacity="0.85">
      <rect width="250" height="66" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="url(#cardStroke)" stroke-width="1"/>
      <circle cx="24" cy="24" r="11" fill="#f5c451" fill-opacity="0.85"/>
      <rect x="44" y="16" width="95" height="7" rx="3.5" fill="#22d3ee" opacity="0.8"/>
      <rect x="44" y="29" width="60" height="6" rx="3" fill="#8fa2d6" opacity="0.55"/>
      <rect x="16" y="46" width="216" height="6" rx="3" fill="#8fa2d6" opacity="0.3"/>
      <animateTransform attributeName="transform" type="translate" values="905,150; 905,163; 905,150" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- Chat bubble motif (bottom right, nods to real-time chat feature) -->
    <g transform="translate(950,242)" opacity="0.9">
      <path d="M0 14 Q0 0 14 0 H150 Q164 0 164 14 V44 Q164 58 150 58 H36 L14 74 V58 H14 Q0 58 0 44 Z"
            fill="#ffffff" fill-opacity="0.04" stroke="url(#cardStroke)" stroke-width="1"/>
      <circle cx="26" cy="29" r="4" fill="#22d3ee">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="42" cy="29" r="4" fill="#22d3ee">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="58" cy="29" r="4" fill="#22d3ee">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Left accent rule -->
    <rect x="70" y="118" width="5" height="0" fill="url(#goldText)">
      <animate attributeName="height" values="0;84" dur="0.9s" fill="freeze" begin="0.2s"/>
    </rect>

    <!-- Title -->
    <text x="95" y="150" font-size="54" font-weight="800" fill="url(#goldText)" letter-spacing="0.5">
      SocialApp
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="0.3s"/>
    </text>

    <!-- Blinking cursor after title -->
    <rect x="392" y="106" width="4" height="44" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="1.2s"/>
    </rect>

    <!-- Subtitle -->
    <text x="97" y="182" font-size="17.5" fill="#c9d3f0" opacity="0">
      A backend-free social platform &#8212; real-time chat, friends &amp; AI, powered by React
      <animate attributeName="opacity" values="0;0;1" dur="1.6s" fill="freeze" begin="0.6s"/>
    </text>

    <!-- Tech pill row -->
    <g font-size="13.5" font-weight="600" opacity="0">
      <animate attributeName="opacity" values="0;0;1" dur="1.6s" fill="freeze" begin="1s"/>

      <rect x="97" y="206" width="72" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="133" y="224" fill="#7ee7fb" text-anchor="middle">React</text>

      <rect x="181" y="206" width="88" height="28" rx="14" fill="#f5c451" fill-opacity="0.12" stroke="#f5c451" stroke-opacity="0.5"/>
      <text x="225" y="224" fill="#f8d878" text-anchor="middle">Tailwind</text>

      <rect x="281" y="206" width="112" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="337" y="224" fill="#7ee7fb" text-anchor="middle">React Router</text>

      <rect x="405" y="206" width="106" height="28" rx="14" fill="#f5c451" fill-opacity="0.12" stroke="#f5c451" stroke-opacity="0.5"/>
      <text x="458" y="224" fill="#f8d878" text-anchor="middle">OpenAI API</text>

      <rect x="523" y="206" width="128" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="587" y="224" fill="#7ee7fb" text-anchor="middle">Real-Time Chat</text>
    </g>

    <!-- Bottom hairline -->
    <rect x="0" y="318" width="1200" height="2" fill="url(#cardStroke)" opacity="0.5"/>
  </g>
</svg>
